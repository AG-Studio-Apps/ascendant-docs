<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D1115">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}{% if page.url == '/' %} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/icon-512.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/icon-512.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- One family. The app sets its display type in New York, which is Apple's
     and cannot be served on the web; Newsreader is the nearest thing in feel,
     a serif drawn to be read at length rather than admired at 96px. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% seo title=false %}
